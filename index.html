<!DOCTYPE html>

<html lang="en">

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/index.css">

    <title>Snitap Patind</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500&family=Montserrat:wght@500&family=Syne:wght@700&display=swap" rel="stylesheet">

</head>

<body>

    <header class="top">
        <a href="#">
            <img src="assets/logo.svg" alt="Snitap Logo">
        </a>

        <a href="#">
            <img src="assets/icons/shopping-bag.svg" alt="Shopping bag icon">
            <span>1</span>
        </a>
    </header>

    <section class="hero">
        <div>
            <h1>
              Snitap, making your life more
              <div>
                <span>radical</span>
                <span>fun</span>
                <span>healthy</span>
                <span>radical</span>
              </div>
            </h1>

            <div class="buttons">
                <a href="#" class="button buy shadow">
                    <img src="assets/icons/shopping-bag.svg" alt="">
                    BUY NOW
                </a>

                <a href="#" class="button play">
                    <span class="shadow">
                        <img src="assets/icons/play.svg" alt="">
                    </span>
                    WATCH IN ACTION
                </a>
            </div>
        </div>

        <div>
            <div class="content">
                <img src="assets/hero/ellipse.svg" alt="Decorative ellipse">
                <img src="assets/hero/patins-image.png" alt="Roller skates image">
                <img src="assets/hero/stars-1.svg" alt="Decorative stars">
                <img src="assets/hero/stars-2.svg" alt="Decorative stars">
            </div>
        </div>
    </section>

    <section class="banner">
        <div class="scroller bg-grandient-animate">
            <div class="rolling">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <!-- repeated images kept as-is -->
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
                <img src="assets/Star 6.png" alt="" class="star">
                <img src="assets/Patins.png" alt="Roller Skates">
            </div>
        </div>
    </section>

    <section class="gallery">
        <header>
            <span>PHOTO GALLERY</span>
            <h2>#usesnitap around the world</h2>
        </header>

        <div class="content">
            <figure>
                <img src="assets/images/01.png" alt="Girl roller skating">
                <figcaption>
                    <img src="assets/images/person.png" alt="User profile picture">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>

            <figure data-delay>
                <img src="assets/images/02.png" alt="Group of people roller skating">
                <figcaption>
                    <img src="assets/images/person.png" alt="User profile picture">
                    <span>@lucasantos</span>
                </figcaption>
            </figure>

            <figure>
                <img src="assets/images/03.png" alt="Person putting on roller skates">
                <figcaption>
                    <img src="assets/images/person.png" alt="User profile picture">
                    <span>@theresacomit</span>
                </figcaption>
            </figure>

            <figure data-delay>
                <img src="assets/images/04.png" alt="Roller skating scene">
                <figcaption>
                    <img src="assets/images/person.png" alt="User profile picture">
                    <span>@carolzinha__</span>
                </figcaption>
            </figure>
        </div>

    </section>

    <footer>
        <div class="logo">
            <img src="assets/logo.svg" alt="Snitap Logo">
            Snitap
        </div>

        <nav>
            <a href="#">About</a>
            <a href="#">Our Stores</a>
            <a href="#">Privacy Policy</a>
        </nav>

        <div class="social-links">
            <a href="#" title="instagram">
                <img src="assets/icons/instagram.svg" alt="Instagram icon">
            </a>

            <a href="#" title="facebook">
                <img src="assets/icons/facebook.svg" alt="Facebook icon">
            </a>

            <a href="#" title="youtube">
                <img src="assets/icons/youtube.svg" alt="YouTube icon">
            </a>

            <a href="#" title="tiktok">
                <img src="assets/icons/tiktok.svg" alt="TikTok icon">
            </a>
        </div>
    </footer>

</body>
</html>
